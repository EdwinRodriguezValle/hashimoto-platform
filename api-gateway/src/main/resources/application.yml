server:
  port: 8081

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: patient-service-route
          uri: http://patient-service:8080 # 👈 URL interna de la red de Docker
          predicates:
            - Path=/api/patients/**

  security:
    oauth2:
      resourceserver:
        jwt:
          # El issuer es la URL pública del realm; el JWKS usa el DNS de Compose por defecto.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/hashimoto-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/hashimoto-realm/protocol/openid-connect/certs}

app:
  security:
    api-audience: ${API_AUDIENCE:api-gateway-client}


logging:
  file:
    # Ruta definitiva: siempre /app/logs/... dentro del contenedor
    name: ${LOG_PATH:/app/logs/api-gateway.log}

management:
  endpoints:
    web:
      exposure:
        # Expone solo los endpoints necesarios por seguridad (Health y Prometheus)
        include: "health,prometheus"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      # Añade el nombre del microservicio automáticamente a cada métrica
      application: ${spring.application.name}
