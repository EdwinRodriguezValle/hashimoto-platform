spring:
    cloud:
        gateway:
            routes:
                - id: patient-service-route # 👈 Describe el destino. ¡Usa dos puntos, no el signo igual!
                  uri: http://localhost:8080
                  predicates:
                      - Path=/api/patients/** # 👈 Asegura el espacio después del guion

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/hashimoto-realm}
                    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8082/realms/hashimoto-realm/protocol/openid-connect/certs}

# 💥 Variable de entorno para tus logs locales en formato YAML
LOG_PATH: "../logs/api-gateway.log"
