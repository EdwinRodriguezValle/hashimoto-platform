spring:
  application:
    name: patient-service

  # Forzar a Spring Boot a levantar el servidor web Tomcat
  main:
    web-application-type: servlet

  # Configuración de base de datos orientada a la red de Docker
  datasource:
    url: jdbc:postgresql://postgres:5432/patient_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # Configuración de Hibernate / JPA
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Infraestructura unificada de Kafka en Docker
  kafka:
    bootstrap-servers: kafka:29092

  # 🔐 Configuración base de Keycloak dentro de la red de Docker
  security:
    oauth2:
      resourceserver:
        jwt:
          # 👇 EL TRUCO: Le decimos al backend que el emisor esperado es el que firma el navegador físico
          # 1. El Emisor esperado: Coincide con lo que firmó tu navegador afuera en tu PC
          issuer-uri: http://localhost:8080/realms/hashimoto-realm
          # 2. Dirección interna de Docker: Usa el host "keycloak" y el puerto interno "8080"
          jwk-set-uri: http://keycloak:8080/realms/hashimoto-realm/protocol/openid-connect/certs

            # 👇 AGREGA ESTA LÍNEA AQUÍ:
            # Evita que Spring valide el endpoint de Keycloak obligatoriamente al arrancar
        client:
          provider:
            keycloak:
             issuer-uri: http://keycloak:8080/realms/hashimoto-realm



# Configuración del motor de Axon Framework e integración con Kafka
axon:
  # Desactivar la búsqueda automática de Axon Server
  axonserver:
    enabled: false

  kafka:
    bootstrap-servers: kafka:29092
    default-topic: patient-events
    producer:
      event-processor-mode: subscribing

    # Serializadores obligatorios para enviar bytes a Kafka
    properties:
      key:
        serializer: org.apache.kafka.common.serialization.StringSerializer
      value:
        serializer: org.apache.kafka.common.serialization.ByteArraySerializer

logging:
  file:
    # Ruta definitiva: siempre /app/logs/... dentro del contenedor
    name: ${LOG_PATH:/app/logs/patient-service.log}
  level:
    org.springframework.security: DEBUG
    org.axonframework: INFO

management:
  endpoints:
    web:
      exposure:
        # Expone solo los endpoints necesarios por seguridad (Health y Prometheus)
        include: "health,prometheus"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      # Añade el nombre del microservicio automáticamente a cada métrica
      application: ${spring.application.name}