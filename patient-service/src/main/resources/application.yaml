spring:
  application:
    name: patient-service

  # Forzar a Spring Boot a levantar el servidor web Tomcat
  main:
    web-application-type: servlet

  # Configuración de base de datos orientada a la red de Docker
  datasource:
    url: jdbc:postgresql://postgres:5432/patient_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # Configuración de Hibernate / JPA
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Infraestructura unificada de Kafka en Docker
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

  # 🔐 Configuración base de Keycloak dentro de la red de Docker
  security:
    oauth2:
      resourceserver:
        jwt:
          # El emisor coincide con el `iss` público del token. El JWKS puede usar
          # una ruta privada que sea alcanzable desde la red del servicio.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/hashimoto-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/hashimoto-realm/protocol/openid-connect/certs}

# Configuración del motor de Axon Framework e integración con Kafka
axon:
  # Desactivar la búsqueda automática de Axon Server
  axonserver:
    enabled: false

  kafka:
    bootstrap-servers: ${AXON_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}}
    default-topic: patient-events
    producer:
      event-processor-mode: subscribing

    # Serializadores obligatorios para enviar bytes a Kafka
    properties:
      key:
        serializer: org.apache.kafka.common.serialization.StringSerializer
      value:
        serializer: org.apache.kafka.common.serialization.ByteArraySerializer

logging:
  file:
    # Ruta definitiva: siempre /app/logs/... dentro del contenedor
    name: ${LOG_PATH:/app/logs/patient-service.log}
  level:
    org.springframework.security: DEBUG
    org.axonframework: INFO

management:
  endpoints:
    web:
      exposure:
        # Expone solo los endpoints necesarios por seguridad (Health y Prometheus)
        include: "health,prometheus"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      # Añade el nombre del microservicio automáticamente a cada métrica
      application: ${spring.application.name}
