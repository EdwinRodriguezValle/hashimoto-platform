server {
    listen 80;
    server_name localhost;

    # 1. Tu regla de oro para servir los archivos de React y manejar rutas del navegador
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. 🔥 EL BLOQUE QUE FALTA: Redirige las llamadas del formulario al API Gateway
    location /api {
        # 'api-gateway' es el nombre de tu servicio en el docker-compose.yml
        proxy_pass http://api-gateway:8081;

        # Cabeceras obligatorias para mantener el contexto de la petición
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para conexiones HTTP estables sin romper métodos POST/PUT
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Redirigir errores del servidor
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}