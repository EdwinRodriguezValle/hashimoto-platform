server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # LA REGLA DE ORO SENIOR: Redirige cualquier subruta al index.html de React
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Redirigir errores del servidor
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}