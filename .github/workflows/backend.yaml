name: Backend CI

on:
  pull_request:
    paths:
      - 'api-gateway/**'
      - 'patient-service/**'
      - 'pom.xml'
      - '.github/workflows/backend.yaml'

jobs:
  validate-backend:
    runs-on: ubuntu-24.04
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # 👈 GitHub Actions usará Java 21 para compilar tu backend
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Verify with Maven
        run: mvn clean verify
