name: Publish OCI Images to GHCR

on:
  push:
    branches:
      - main
      - master
      - feature/devops_argocd

permissions:
  contents: read
  packages: write # Permiso crucial para que el workflow pueda subir imágenes a tu sección de Packages

env:
  REGISTRY: ghcr.io
  # Esto convertirá automáticamente el nombre de tu usuario/organización a minúsculas para evitar errores en Docker
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Set up QEMU (to emulate architecture if required)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Inmutable Tag (Short SHA)
        id: vars
        run: echo "sha_short=$(git rev-parse --short=12 HEAD)" >> $GITHUB_OUTPUT

      # --- 1. CONSTRUCCIÓN DEL FRONTEND ---
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./hashimoto-tracker-app
          file: ./hashimoto-tracker-app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/hashimoto-frontend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 2. CONSTRUCCIÓN DEL API GATEWAY ---
      - name: Build & Push API Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api-gateway/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api-gateway:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 3. CONSTRUCCIÓN DEL PATIENT SERVICE ---
      - name: Build & Push Patient Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./patient-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/patient-service:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max