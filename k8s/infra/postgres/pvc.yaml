# OPTIMIZACIÓN KUBERNETES: para acelerar el rendimiento en cluster, aumentamos almacenamiento persistente y dejamos la BD como StatefulSet con PVC real.
# Esto evita que el estado de Postgres se pierda al reiniciar el pod y mejora la estabilidad de I/O.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: hashimoto-infra
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path # El proveedor de almacenamiento por defecto de K3d
  resources:
    requests:
      storage: 10Gi

