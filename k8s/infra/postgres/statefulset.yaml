# Aquí configuramos el contenedor de Postgres 16 leyendo las credenciales de tu archivo platform-env.yaml
# que inyectamos antes, y definimos su servicio interno para que otros contenedores lo encuentren.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: hashimoto-infra
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
              name: dbport
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            # 👇 NUEVO: Montamos el archivo virtual del script SQL en la ruta de inicio
            - name: init-script-volume
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        # 👇 NUEVO: Declaramos el volumen virtual apuntando al ConfigMap
        - name: init-script-volume
          configMap:
            name: postgres-init-script
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: hashimoto-infra
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
