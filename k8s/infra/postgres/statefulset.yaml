# OPTIMIZACIÓN KUBERNETES: Postgres debe ir como StatefulSet con PVC real y recursos suficientes para no sufrir latencia por CPU/memoria bajo carga.
# Esto mejora la velocidad del flujo HTTP -> Axon -> Event Store en cluster.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: hashimoto-infra
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          command:
            - /bin/bash
            - -c
            - |
              exec docker-entrypoint.sh postgres \
                -c shared_buffers=768MB \
                -c work_mem=16MB \
                -c max_connections=150
          resources:
            requests:
              cpu: "750m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
              name: dbport
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-script-volume
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-script-volume
          configMap:
            name: postgres-init-script
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: hashimoto-infra
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
