# OPTIMIZACIÓN KUBERNETES: Kafka debe ir con StatefulSet + PVC real y recursos suficientes para no saturar red y disco.
# También dejamos más particiones por defecto para evitar que todo viaje por la misma partición.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: hashimoto-infra
spec:
  serviceName: "kafka-service"
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          resources:
            requests:
              cpu: "750m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
            - name: KAFKA_ADVERTISED_LISTENERS
              value: 'PLAINTEXT://kafka-service.hashimoto-infra.svc.cluster.local:9092,PLAINTEXT_HOST://localhost:29092'
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: 'broker,controller'
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              # Single-node local KRaft quorum: connect to this broker directly,
              # avoiding a readiness/DNS dependency on a Kubernetes Service.
              value: '1@localhost:29093'
            - name: KAFKA_LISTENERS
              value: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: 'PLAINTEXT'
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: 'CONTROLLER'
            - name: KAFKA_LOG_DIRS
              value: '/tmp/kraft-combined-logs'
            - name: KAFKA_MESSAGE_MAX_BYTES
              value: '10485760'
            - name: KAFKA_REPLICA_FETCH_MAX_BYTES
              value: '10485760'
            - name: KAFKA_COMPRESSION_TYPE
              value: 'producer'
            - name: CLUSTER_ID
              value: 'MkU3OEVBNTcwNTJENDM2Qk'
          ports:
            - containerPort: 9092
              name: broker
            - containerPort: 29093
              name: controller
          readinessProbe:
            tcpSocket:
              port: broker
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          volumeMounts:
            - name: kafka-storage
              mountPath: /tmp/kraft-combined-logs
      volumes:
        - name: kafka-storage
          persistentVolumeClaim:
            claimName: kafka-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: hashimoto-infra
spec:
  ports:
    - port: 9092
      name: broker
      targetPort: 9092
    - port: 29093
      name: controller
      targetPort: 29093
  selector:
    app: kafka
