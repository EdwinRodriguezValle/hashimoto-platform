# OPTIMIZACIÓN KUBERNETES: Kafka debe correr como StatefulSet con PVC real para mantener logs y offsets en almacenamiento persistente y evitar latencia por I/O degradada.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
  namespace: hashimoto-infra
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
