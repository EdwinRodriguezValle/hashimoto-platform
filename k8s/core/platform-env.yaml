# guardar las variables de entorno que tus aplicaciones y servicios van a leer más adelante.
#(Nota: Para producción las contraseñas se encriptan, pero para empezar a probar las dejaremos legibles en texto plano usando un formato básico).

# 🍏 CAPA DE NEGOCIO (CORE)
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: hashimoto-core
data:
  DB_NAME: "patient_db"
  DB_USER: "postgres"
  KEYCLOAK_ISSUER_URI: "http://localhost:8085/auth/realms/hashimoto-realm"
  KEYCLOAK_JWK_SET_URI: "http://keycloak-service.hashimoto-infra.svc.cluster.local:8080/auth/realms/hashimoto-realm/protocol/openid-connect/certs"
  API_AUDIENCE: "api-gateway-client"
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: hashimoto-core
type: Opaque
stringData:
  DB_PASSWORD: "123"
---
