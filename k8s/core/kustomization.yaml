apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - platform-env.yaml
  - patient-service/deployment.yaml
  - patient-service/service.yaml
  - api-gateway/deployment.yaml
  - api-gateway/service.yaml
  - api-gateway/ingress.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/frontend-config.yaml

images:
  - name: hashimoto/patient-service
    newName: hashimoto/patient-service
    newTag: "a7904384d258"
  - name: hashimoto/api-gateway
    newName: hashimoto/api-gateway
    newTag: "a7904384d258"
  - name: hashimoto/frontend
    newName: hashimoto/frontend
    newTag: "a7904384d258"
