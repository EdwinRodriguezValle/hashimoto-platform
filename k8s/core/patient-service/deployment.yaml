# Configurará un pod ejecutable apuntando a una imagen local llamada hashimoto/patient-service:latest.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: hashimoto-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
        - name: patient-service
          image: hashimoto/patient-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # 📂 Variable de Logs
            - name: LOG_PATH
              value: "/app/logs/patient-service.log"

            # 🗄️ Variables de Base de Datos
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service.hashimoto-infra.svc.cluster.local:5432/hashimoto_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DB_PASSWORD

            # 🦫 Variables de Kafka Broker
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service.hashimoto-infra.svc.cluster.local:9092"

            # 🛡️ Variables de Seguridad (URL interna de Keycloak corregida)
            - name: KEYCLOAK_AUTH_SERVER_URL
              value: "http://cluster.local"

          # 📦 Solución Logback
          volumeMounts:
            - name: app-logs
              mountPath: /app/logs

      volumes:
        - name: app-logs
          emptyDir: {}
