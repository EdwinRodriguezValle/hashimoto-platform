# Configurará un pod ejecutable apuntando a una imagen local llamada hashimoto/patient-service:latest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: hashimoto-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
        - name: patient-service
          image: hashimoto/patient-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: LOG_PATH
              value: "/app/logs/patient-service.log"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service.hashimoto-infra.svc.cluster.local:5432/hashimoto_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DB_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service.hashimoto-infra.svc.cluster.local:9092"
            - name: KEYCLOAK_AUTH_SERVER_URL
              value: "http://cluster.local"

#          # 🩺 Sondas de salud optimizadas con margen de inicialización extendido
#          livenessProbe:
#            httpGet:
#              path: /actuator/health/liveness
#              port: 8080
#            initialDelaySeconds: 90 # 👈 Le otorgamos 90 segundos para establecer conexiones con Postgres y Kafka
#            periodSeconds: 15
#            failureThreshold: 4
#          readinessProbe:
#            httpGet:
#              path: /actuator/health/readiness
#              port: 8080
#            initialDelaySeconds: 90
#            periodSeconds: 15
#
          volumeMounts:
            - name: app-logs
              mountPath: /app/logs
      volumes:
        - name: app-logs
          emptyDir: {}
