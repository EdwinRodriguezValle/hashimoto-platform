# OPTIMIZACIÓN KUBERNETES: para acelerar el servicio en cluster, subimos memoria/CPU, ajustamos probes para arrancar Axon/Spring y activamos JVM con G1GC + soporte a contenedores.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: hashimoto-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
        - name: patient-service
          image: hashimoto/patient-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: LOG_PATH
              value: "/app/logs/patient-service.log"
            - name: APP_SECURITY_DISABLED
              value: "false"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:+UseG1GC -Xms512m -Xmx1g"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service.hashimoto-infra.svc.cluster.local:5432/hashimoto_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service.hashimoto-infra.svc.cluster.local:9092"
            - name: AXON_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service.hashimoto-infra.svc.cluster.local:9092"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://keycloak-service.hashimoto-infra.svc.cluster.local:8080/realms/hashimoto-realm"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: "http://keycloak-service.hashimoto-infra.svc.cluster.local:8080/realms/hashimoto-realm/protocol/openid-connect/certs"
            - name: KEYCLOAK_AUTH_SERVER_URL
              value: "http://keycloak-service.hashimoto-infra.svc.cluster.local:8080"
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "1.5Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6

          volumeMounts:
            - name: app-logs
              mountPath: /app/logs
      volumes:
        - name: app-logs
          emptyDir: {}
