apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hashimoto-ingress
  namespace: hashimoto-core
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # 🛡️ Ruta de Autenticación: Apunta al puente local corregido
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak-bridge-service # 👈 ¡Corregido! Sin puntos y 100% válido
                port:
                  number: 8080

          # ⚙️ Ruta de APIs hacia tu API Gateway
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8081

          # 🌐 Ruta Raíz hacia tu Frontend de React/Vite
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80