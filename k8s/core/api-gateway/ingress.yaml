apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hashimoto-ingress
  namespace: hashimoto-core
  annotations:
    # Desactivamos redirecciones SSL forzadas para desarrollo local en HTTP plano
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # ⚙️ Ruta 1: Todas las peticiones que vayan a las APIs (/api) se envían al API Gateway
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8081

          # 🌐 Ruta 2: Todo el tráfico de la raíz (/) va directo a tu Frontend de manera limpia
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
