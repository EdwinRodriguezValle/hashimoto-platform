apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hashimoto-ingress
  namespace: hashimoto-core
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    # 🚀 EL TRUCO SENIOR: Corta el prefijo /api antes de enviárselo a Java para que no de 404
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak-bridge-service
                port:
                  number: 8080

          # ⚙️ Modificamos el path capturando el resto de la URL con un comodín (.*)
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 8081

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
