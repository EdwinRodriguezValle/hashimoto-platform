# La etiqueta concreta se aplica desde k8s/core/kustomization.yaml.
#e incluirá también el volumen de logs para evitar el mismo problema que sufrió el servicio de pacientes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: hashimoto-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: hashimoto/api-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: LOG_PATH
              value: "/app/logs/api-gateway.log"
            - name: APP_SECURITY_DISABLED
              value: "false"
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: KEYCLOAK_ISSUER_URI
            - name: KEYCLOAK_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: KEYCLOAK_JWK_SET_URI
            - name: API_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: API_AUDIENCE

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 4

          volumeMounts:
            - name: app-logs
              mountPath: /app/logs
      volumes:
        - name: app-logs
          emptyDir: {}
