apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: hashimoto-core
data:
  default.conf: |
    server {
        listen 80;
        server_name hashimoto.local hashimoto;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # TEMPORARY DEV BYPASS: Keycloak disabled while validating the cluster and app routing.
        # The SPA is served directly; actual API routing goes through the Ingress at /api.

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }