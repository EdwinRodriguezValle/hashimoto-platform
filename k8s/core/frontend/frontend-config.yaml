apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: hashimoto-core
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost hashimoto.local hashimoto;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # The SPA is served here. Traefik routes /api and /auth to their own
        # Kubernetes Services, so the browser keeps one origin for OIDC and API calls.

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
