# Despliegue de Prometheus con RBAC (Control de Acceso Completo)

# En una empresa, no puedes lanzar un pod de monitoreo y dejar que lea el clúster sin permisos explícitos.
# Necesitamos crear un ClusterRole (un permiso global) y un ServiceAccount (la identidad del Pod)
# para que Kubernetes le permita escanear las métricas legalmente.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: hashimoto-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-cluster-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: prometheus-sa
    namespace: hashimoto-ops
roleRef:
  kind: ClusterRole
  name: prometheus-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: hashimoto-ops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi # Mayor espacio para retención de métricas empresariales
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: hashimoto-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-sa # 👈 Usa la identidad con permisos asignados
      containers:
        - name: prometheus
          image: prom/prometheus:v2.45.0 # Usamos versiones fijas estables, NUNCA ':latest' en empresas
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d" # Retención formal de 15 días
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: storage-volume
              mountPath: /prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: storage-volume
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: hashimoto-ops
spec:
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: prometheus

