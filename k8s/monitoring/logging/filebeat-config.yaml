# Filebeat recoge stdout/stderr de los contenedores del nodo y los envía a Elasticsearch.
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: hashimoto-logs
  labels:
    k8s-app: filebeat
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: container
        paths:
          - /var/log/containers/*.log
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: "/var/log/containers/"

    output.elasticsearch:
      hosts: ["http://elasticsearch-service.hashimoto-logs.svc.cluster.local:9200"]
      index: "hashimoto-platform-logs-%{+yyyy.MM.dd}"

    setup.template.name: "hashimoto-platform-logs"
    setup.template.pattern: "hashimoto-platform-logs-*"
    setup.ilm.enabled: false
