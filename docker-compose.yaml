services:
  # Database: PostgreSQL
  postgres:
    image: postgres:16
    container_name: patient-postgres
    environment:
      POSTGRES_DB: patient_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
      # 👇 NUEVO MAPEO: Inyecta la configuración del Datasource automáticamente
      - postgres_data:/var/lib/postgresql/data # 👈 AGREGA ESTO para que los datos de Postgres nunca se borren
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d patient_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform-network

# Message Broker: Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - platform-network


  # Security and Identity Management
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: hashimoto-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
    ports:
      - "8082:8080" # <-- Puerto 8082 en tu máquina física Keycloak en el puerto 8080 (dentro de la red interna de Docker) y exponerlo hacia afuera en tu máquina local en el puerto 8082
    volumes:
      # 2. MAPEAMOS TU CONFIGURACIÓN AL CONTENEDOR 📁
      # Vincula tu carpeta local con la carpeta interna donde Keycloak busca los JSON para importar
      - ./keycloak-config:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
    # 💥 SOLUCIÓN DEFINITIVA: Abre un socket crudo de red para verificar si el puerto 8080 responde.
    # No requiere tener instalado curl ni wget en el contenedor.
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/hashimoto-realm HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200\\|302\\|404'" ]
      interval: 5s
      timeout: 5s
      retries: 6
    networks:
      - platform-network

# Observability Stack: Prometheus + Grafana
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - platform-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - platform-network
    restart: unless-stopped

# Centralized Logging Stack: Elasticsearch + Kibana + Filebeat
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: filebeat
    user: root
    command: [ "--strict.perms=false" ]
    volumes:
      - ./hashimoto_logs:/app/logs # 📁 Mapeo limpio: host ./hashimoto_logs -> contenedor /app/logs
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - platform-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - platform-network

# Microservices: Patient Service + API Gateway
  patient-service:
    build:
      context: . # 💥 CONTEXTO EN LA RAÍZ GLOBAL: Así puede leer el POM Padre
      dockerfile: patient-service/Dockerfile # Ruta exacta desde la raíz
    container_name: patient-service
    ports:
      - "8080:8080"
    environment:
      - LOG_PATH=/app/logs/patient-service.log
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      keycloak:
        condition: service_healthy

    volumes:
      - ./hashimoto_logs:/app/logs # 📁 Mapeo limpio: host ./hashimoto_logs -> contenedor /app/logs
    networks:
      - platform-network

  api-gateway:
    build:
      context: . # 💥 CONTEXTO EN LA RAÍZ GLOBAL: Para heredar del padre
      dockerfile: api-gateway/Dockerfile # Ruta exacta desde la raíz
    container_name: api-gateway
    user: root
    ports:
      - "8081:8081"
    entrypoint: ["sh", "-c", "sleep 15 && java -jar app.jar"]
    environment:
      - LOG_PATH=/app/logs/patient-service.log
    depends_on:
      keycloak:
        condition: service_started
    volumes:
      - ./hashimoto_logs:/app/logs # 📁 Mapeo limpio: host ./hashimoto_logs -> contenedor /app/logs
    networks:
      - platform-network

# frontend: React App + Nginx
  frontend:
    build:
      context: ./hashimoto-tracker-app
      dockerfile: Dockerfile
    container_name: hashimoto-frontend
    user: "1000:1000" # Alineado a tu estándar de seguridad Edwin
    ports:
      - "5173:80" # 💥 MAPEO SEGURO: Tu PC física escucha en el puerto 80, Nginx por dentro escucha en el 80
    depends_on:
      - api-gateway # Espera a que el Gateway esté levantado para poder consumir la API
    networks:
      - platform-network

volumes:
  esdata:
  hashimoto_logs:
  postgres_data: # 👈 AGREGA ESTO para que los datos de Postgres nunca se borren
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  platform-network:
    driver: bridge # Crea una red interna tipo puente para interconectar los contenedores
