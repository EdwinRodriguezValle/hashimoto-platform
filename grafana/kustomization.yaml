apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hashimoto-ops
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: grafana-dashboard-config
    files:
      - provider.yml=provisioning/dashboards/provider.yml
      - platform-overview.json=provisioning/dashboards/platform-overview.json
